name: Deploy Convex backend

on:
  push:
    branches: [main]
    paths:
      - "convex/**"
      - "package.json"
      - "package-lock.json"
      - "convex.json"
      - "scripts/catalog-batch-001.json"
      - "scripts/catalog-batch-002.json"
      - "scripts/catalog-batch-003a.json"
      - "scripts/catalog-batch-004-images.json"
      - "scripts/validate-catalogue.mjs"
      - "scripts/reconcile-catalogue-images.mjs"
  workflow_dispatch:

concurrency:
  group: wellcare-medicose-production-catalogue
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile image catalogue against existing production catalogue
        run: node scripts/reconcile-catalogue-images.mjs

      - name: Validate complete catalogue before production changes
        run: node scripts/validate-catalogue.mjs

      - name: Deploy Convex production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --typecheck=disable

      - name: Seed catalogue batch 001
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run medicines:seedManyV2 "$(cat scripts/catalog-batch-001.json)" --prod

      - name: Seed catalogue batch 002
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run medicines:seedManyV2 "$(cat scripts/catalog-batch-002.json)" --prod

      - name: Seed catalogue batch 003a
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run medicines:seedManyV2 "$(cat scripts/catalog-batch-003a.json)" --prod

      - name: Seed verified image batch 004
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex run medicines:seedManyV2 "$(cat scripts/catalog-batch-004-images.json)" --prod

      - name: Verify production catalogue count and records
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          node -e "const fs=require('fs'); const files=['scripts/catalog-batch-001.json','scripts/catalog-batch-002.json','scripts/catalog-batch-003a.json','scripts/catalog-batch-004-images.json']; const all=files.flatMap(f=>JSON.parse(fs.readFileSync(f,'utf8')).items); fs.writeFileSync('/tmp/catalog-verify.json', JSON.stringify({names:all.map(x=>x.name)})); console.log('Expected unique production records:', all.length)"
          npx convex run medicines:verifyCatalogue "$(cat /tmp/catalog-verify.json)" --prod

      - name: Production catalogue gate
        run: echo "Catalogue deployment completed only after validation, seed and production verification."
