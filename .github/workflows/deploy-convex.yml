name: Deploy Convex backend

on:
  push:
    branches:
      - main
    paths:
      - "convex/**"
      - "package.json"
      - "package-lock.json"
      - "convex.json"
      - "scripts/catalog-batch-001.json"
      - "scripts/catalog-batch-002.json"
      - "scripts/catalog-batch-003a.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex production backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --typecheck=disable

      - name: Seed verified catalogue batches
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          ARGS=$(cat scripts/catalog-batch-001.json)
          npx convex run medicines:seedManyV2 "$ARGS" --prod
          ARGS=$(cat scripts/catalog-batch-002.json)
          npx convex run medicines:seedManyV2 "$ARGS" --prod
          ARGS=$(cat scripts/catalog-batch-003a.json)
          npx convex run medicines:seedManyV2 "$ARGS" --prod
